[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchtower"
version = "1.0.0"
description = "AI Security Analyzer for UGREEN NAS - Natural language query to cross-camera anomaly detection to HTML security briefing with video clips"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AHVO2 Team", email = "founder@ahvo2.local"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Security",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "black>=23.0",
]

[project.scripts]
watchtower = "watchtower.__main__:main"

[project.urls]
Homepage = "https://github.com/AHVO2/watchtower"
Repository = "https://github.com/AHVO2/watchtower"
Issues = "https://github.com/AHVO2/watchtower/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["watchtower*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=watchtower --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "T20"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''